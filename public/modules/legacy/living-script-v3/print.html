<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read-Aloud Script — The Living Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cardo:ital,wght@0,400;0,700;1,400&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
  /* Not a mockup screen: a printable document in the Storybook type and
     colours (vellum, ink, gold rule). Use the browser's Print → Save as
     PDF. */
  :root { --ink: #1B2A36; --navy: #0F1E28; --gold: #B8923E; --gold-text: #8A6420; --teal: #2E6E69; --muted: #3B4B57; --vellum: #EDE6D6; --paper: #F6F1E6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B1620; font-family: 'Cardo', Georgia, serif; color: var(--ink); }
  .toolbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; background: #0F1E28; border-bottom: 1px solid #1E3A3A; color: #A9C9C4; font-style: italic; }
  .toolbar button { height: 44px; padding: 0 22px; border: 1px solid #D9A441; border-radius: 6px; background: #D9A441; color: #0F1E28; font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; cursor: pointer; }
  .toolbar button:focus-visible { outline: 3px solid #5AA8A0; outline-offset: 4px; }
  .doc { max-width: 820px; margin: 28px auto 60px; padding: 56px 64px; background: var(--vellum); border-radius: 6px; box-shadow: inset 0 0 70px rgba(160,120,60,0.2), 0 30px 60px rgba(0,0,0,0.5); position: relative; }
  .doc::before { content: ''; position: absolute; inset: 14px; border: 1px solid var(--gold); border-radius: 4px; pointer-events: none; }
  .kicker { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 4px; color: var(--gold-text); }
  h1 { margin: 6px 0 4px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 34px; line-height: 1.15; color: var(--navy); }
  h2 { margin: 0 0 14px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 24px; color: var(--navy); border-bottom: 1px solid var(--gold); padding-bottom: 8px; }
  h3 { margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: 16px; color: var(--navy); }
  p { margin: 0; font-size: 17px; line-height: 1.55; }
  .muted { color: var(--muted); font-style: italic; }
  .section { margin-top: 34px; }
  .cover { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rule { width: 240px; height: 1px; background: var(--gold); margin: 12px auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #CDBF9F; vertical-align: top; }
  th { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px; color: var(--gold-text); font-weight: 600; }
  .beat { margin: 0 0 18px; display: flex; flex-direction: column; gap: 6px; break-inside: avoid; }
  .who { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 3px; color: var(--teal); }
  .who.character { color: var(--gold-text); }
  .lines { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .lines li { padding: 8px 12px; background: var(--paper); border: 1px solid #CDBF9F; border-radius: 8px; font-size: 16px; line-height: 1.4; }
  .tone { display: block; font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: var(--teal); }
  .box { padding: 12px 14px; border: 1px dashed var(--gold); border-radius: 8px; display: flex; flex-direction: column; gap: 6px; break-inside: avoid; }
  .rules { margin: 4px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.5; }
  .pills { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: var(--teal); }
  .note { font-size: 14px; }
  .act { break-before: page; }
  .act:first-of-type { break-before: auto; }
  .sealed { break-before: page; border: 2px dashed var(--gold); border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; padding: 60px 0; }
  @page { size: A4; margin: 16mm; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .doc { max-width: none; margin: 0; padding: 0; background: none; box-shadow: none; border-radius: 0; }
    .doc::before { display: none; }
    .lines li { background: none; }
  }
</style>
</head>
<body>
<div class="toolbar"><span id="toolbarNote">Print, or choose "Save as PDF" in the print window.</span><button type="button" id="btnPrint">PRINT / SAVE AS PDF</button></div>
<main class="doc" id="doc"></main>
<script type="module" src="js/print.js"></script>
</body>
</html>
