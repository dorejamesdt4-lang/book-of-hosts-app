</div>

</header>
<div style="padding: 20px 64px 0; display: flex; align-items: center; gap: 14px">

</div>

<div id="leftLabel" style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 6px; color: #8A6420">THE SPOTLIGHT</div>
<div style="position: relative">

</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 30px; background: #0F1E28; border: 1px solid #D9A441; border-radius: 6px">
<div id="plateName" style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; color: #D9A441; text-align: center"></div>
<div id="plateSub" style="font-style: italic; font-size: 15px; color: #A9C9C4"></div>
</div>

</div>
<div style="position: relative; background: #EDE6D6; border-radius: 6px; box-shadow: inset 0 0 70px rgba(160,120,60,0.2); color: #1B2A36; box-sizing: border-box; padding: 40px 50px; display: flex; flex-direction: column; gap: 16px; border-radius: 0 6px 6px 0; min-height: 0">
<div style="position: absolute; inset: 14px; border: 1px solid #B8923E; border-radius: 4px; pointer-events: none"></div>
<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style="position: absolute; top: 10px; left: 10px; transform: none"><path d="M2 52 L2 14 Q2 2 14 2 L52 2" fill="none" stroke="#B8923E" stroke-width="1.5"></path><path d="M8 52 L8 18 Q8 8 18 8 L52 8" fill="none" stroke="#B8923E" stroke-width="0.8"></path><path d="M14 14 Q22 6 28 14 Q20 20 14 14 Z" fill="#B8923E"></path><circle cx="14" cy="14" r="2.4" fill="#8A6420"></circle></svg><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style="position: absolute; top: 10px; right: 10px; transform: scaleX(-1)"><path d="M2 52 L2 14 Q2 2 14 2 L52 2" fill="none" stroke="#B8923E" stroke-width="1.5"></path><path d="M8 52 L8 18 Q8 8 18 8 L52 8" fill="none" stroke="#B8923E" stroke-width="0.8"></path><path d="M14 14 Q22 6 28 14 Q20 20 14 14 Z" fill="#B8923E"></path><circle cx="14" cy="14" r="2.4" fill="#8A6420"></circle></svg><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style="position: absolute; bottom: 10px; left: 10px; transform: scaleY(-1)"><path d="M2 52 L2 14 Q2 2 14 2 L52 2" fill="none" stroke="#B8923E" stroke-width="1.5"></path><path d="M8 52 L8 18 Q8 8 18 8 L52 8" fill="none" stroke="#B8923E" stroke-width="0.8"></path><path d="M14 14 Q22 6 28 14 Q20 20 14 14 Z" fill="#B8923E"></path><circle cx="14" cy="14" r="2.4" fill="#8A6420"></circle></svg><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style="position: absolute; bottom: 10px; right: 10px; transform: scale(-1, -1)"><path d="M2 52 L2 14 Q2 2 14 2 L52 2" fill="none" stroke="#B8923E" stroke-width="1.5"></path><path d="M8 52 L8 18 Q8 8 18 8 L52 8" fill="none" stroke="#B8923E" stroke-width="0.8"></path><path d="M14 14 Q22 6 28 14 Q20 20 14 14 Z" fill="#B8923E"></path><circle cx="14" cy="14" r="2.4" fill="#8A6420"></circle></svg>

<div id="right" style="position: relative; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; min-height: 0; overflow: hidden"></div>
</div>
</div>
</div>

<!-- Captions for narration and stand-in lines, where the online Stage has its console bar. -->
<div id="captions" role="log" aria-live="polite" style="position: absolute; left: 64px; right: 64px; bottom: 26px; min-height: 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 12px 20px; background: #0F1E28; border: 1px solid #6B5320; border-radius: 12px">
<div id="capWho" style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; color: #D9A441"></div>
<div id="capText" style="font-size: 22px; line-height: 1.35; color: #EDE6D6"></div>
</div>

<!-- Full-board cards: act titles, envelope call-ups, clue reveals, the dice table, the curtain. -->
<div id="overlay" hidden style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,22,32,0.9)">
<div id="overlayCard" style="position: relative; width: 1000px; max-height: 900px; background: #EDE6D6; border-radius: 6px; box-shadow: inset 0 0 70px rgba(160,120,60,0.2), 0 40px 80px rgba(0,0,0,0.6); color: #1B2A36; box-sizing: border-box; padding: 64px 70px 58px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
</div>
<div id="overlayWide" hidden style="width: 1240px"></div>
</div>

<div id="cover" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,22,32,0.86)">
<div style="position: relative; width: 820px; background: #EDE6D6; border-radius: 6px; box-shadow: inset 0 0 70px rgba(160,120,60,0.2), 0 40px 80px rgba(0,0,0,0.6); color: #1B2A36; box-sizing: border-box; padding: 56px 60px 50px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
<div style="position: absolute; inset: 14px; border: 1px solid #B8923E; border-radius: 4px; pointer-events: none"></div>
<div style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 5px; color: #8A6420">THEATRE · TONIGHT'S TALE</div>
<div id="coverTitle" style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 40px; line-height: 1.15; color: #0F1E28"></div>
<div id="coverSub" style="font-style: italic; font-size: 19px; color: #3B4B57"></div>
<button type="button" id="btnStart" class="pbtn" style="margin-top: 10px; width: 104px; height: 104px; border-radius: 50%; border: 3px solid #8A6420; background: #D9A441; box-shadow: inset 0 0 0 6px #E9BE62, inset 0 0 0 8px #8A6420, 0 14px 28px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer" aria-label="Begin the tale"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z" fill="#0F1E28"></path></svg></button>
<div id="coverBeginLabel" style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; letter-spacing: 3px; color: #8A6420">BEGIN THE TALE</div>
<!-- Show Packs only: every audio file is fetched before the show (built
     from the Lobby's progress panel and buttons). -->
<div id="packPrep" hidden style="position: relative; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: left">
<div id="packWarn" role="alert" hidden style="padding: 12px 16px; border: 1px solid #9E3B3B; border-radius: 8px; font-size: 16px; line-height: 1.4; color: #9E3B3B"></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 24px; background: #0F1E28; border: 1px solid #2A4A4A; border-radius: 10px">
<div id="packPrepText" role="status" style="font-size: 16px; font-style: italic; color: #A9C9C4">Preparing the show…</div>
<div style="height: 10px; border-radius: 999px; background: #132A2A; border: 1px solid #2A4A4A; overflow: hidden"><div id="packPrepBar" style="width: 0%; height: 100%; background: #5AA8A0"></div></div>
<div id="packReport" style="font-size: 14px; line-height: 1.4; color: #8FA5A3"></div>
</div>
<div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap">
<button type="button" id="btnPackStart" class="pbtn" disabled style="height: 44px; padding: 0 18px; border: 1px solid #8A6420; border-radius: 6px; background: #D9A441; color: #0F1E28; font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; cursor: pointer">START SHOW</button>
<button type="button" id="btnPackCaptions" class="pbtn" style="height: 44px; padding: 0 18px; border: 1px solid #8A6420; border-radius: 6px; background: transparent; color: #8A6420; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 2px; cursor: pointer">START ANYWAY (CAPTIONS ONLY)</button>
</div>
</div>
<div id="coverHint" style="font-size: 16px; font-style: italic; color: #3B4B57">Move this window to the TV and make it full screen (F11). Then click Begin here, or press your clicker once.</div>
<button type="button" id="btnConsole" class="pbtn" style="height: 44px; padding: 0 18px; border: 1px solid #8A6420; border-radius: 6px; background: transparent; color: #8A6420; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 2px; cursor: pointer">OPEN THE HOST CONSOLE</button>
</div>
</div>

</div>
