<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wardrobe — The Living Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cardo:ital,wght@0,400;0,700;1,400&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://huggingface.co" crossorigin>
<link rel="stylesheet" href="ls.css">
</head>
<body>
<div class="ls-phone" style="background: #0B1620; font-family: 'Cardo', Georgia, serif; color: #EDE6D6">

<div class="star" style="left: 257px; top: 50px; animation-delay: -1.67s; opacity: 0.6"></div><div class="star" style="left: 168px; top: 79px; animation-delay: -0.96s; opacity: 0.6"></div><div class="star" style="left: 358px; top: 11px; animation-delay: -1.46s; opacity: 0.6"></div><div class="star" style="left: 187px; top: 20px; animation-delay: -1.22s; opacity: 0.6"></div><div class="star" style="left: 172px; top: 46px; animation-delay: -1.00s; opacity: 0.6"></div><div class="star" style="left: 7px; top: 132px; animation-delay: -2.07s; opacity: 0.6"></div><div class="star" style="left: 329px; top: 48px; animation-delay: -1.01s; opacity: 0.6"></div><div class="star" style="left: 225px; top: 40px; animation-delay: -0.38s; opacity: 0.6"></div><div class="star" style="left: 210px; top: 79px; animation-delay: -2.72s; opacity: 0.6"></div><div class="star" style="left: 381px; top: 91px; animation-delay: -1.32s; opacity: 0.6"></div><div class="star" style="left: 167px; top: 162px; animation-delay: -1.12s; opacity: 0.6"></div><div class="star" style="left: 325px; top: 164px; animation-delay: -0.54s; opacity: 0.6"></div><div class="star" style="left: 369px; top: 161px; animation-delay: -0.78s; opacity: 0.6"></div><div class="star" style="left: 212px; top: 63px; animation-delay: -0.39s; opacity: 0.6"></div>
<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #1E3A3A">
<a id="back" href="invite.html" style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px; color: #A9C9C4; text-decoration: none; min-height: 44px; display: flex; align-items: center">‹ BACK</a>
<h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; letter-spacing: 3px; color: #D9A441">THE WARDROBE</h1>
<div style="width: 50px"></div>
</header>
<div style="position: relative; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: #0F1E28; border: 1px solid #2A4A4A; border-radius: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><path d="M12 2 L14 9 L21 9 L15.5 13.5 L17.5 21 L12 16.5 L6.5 21 L8.5 13.5 L3 9 L10 9 Z" fill="#D9A441"></path></svg>
<div style="font-size: 15px; line-height: 1.4; color: #A9C9C4"><span style="color: #EDE6D6">Dressed for your part in tonight's script.</span> Change anything you like.</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="position: relative; width: 230px; height: 280px; box-sizing: border-box; border-radius: 115px 115px 10px 10px; background: #0B1620; border: 3px solid #D9A441; box-shadow: 0 0 0 5px #0F1E28, 0 0 0 7px #B8923E; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 26px">
<div class="star" style="left: 86px; top: 6px; animation-delay: -0.79s; opacity: 0.6"></div><div class="star" style="left: 43px; top: 55px; animation-delay: -0.79s; opacity: 0.6"></div><div class="star" style="left: 55px; top: 18px; animation-delay: -1.78s; opacity: 0.6"></div><div class="star" style="left: 133px; top: 10px; animation-delay: -2.44s; opacity: 0.6"></div><div class="star" style="left: 138px; top: 97px; animation-delay: -2.79s; opacity: 0.6"></div><div class="star" style="left: 121px; top: 37px; animation-delay: -1.05s; opacity: 0.6"></div><div class="star" style="left: 46px; top: 13px; animation-delay: -1.04s; opacity: 0.6"></div><div class="star" style="left: 11px; top: 103px; animation-delay: -1.94s; opacity: 0.6"></div><div class="star" style="left: 52px; top: 42px; animation-delay: -0.96s; opacity: 0.6"></div><div class="star" style="left: 216px; top: 115px; animation-delay: -1.34s; opacity: 0.6"></div>
<div style="position: absolute; left: 50%; bottom: 14px; width: 180px; height: 44px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(90,168,160,0.55), rgba(90,168,160,0) 70%)"></div>
<div class="ls-sprite" id="spriteBox" style="width: 176px; height: 176px">
<iframe id="spriteFrame" title="Your character" sandbox="allow-scripts"></iframe>
</div>
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 4px); pointer-events: none"></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div id="asLine" style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; color: #D9A441; text-align: center"></div>
<div style="font-family: 'Silkscreen', monospace; font-size: 9px; color: #5AA8A0">64×64 · TALKS IN EVERY OUTFIT</div>
</div>
</div>
<!-- The mockup's Headwear, Coat colour and Accessories rows are left out
     until real part art (and palette swaps) exist. In their place, a
     row of the existing sprites that suit tonight's theme. -->
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; color: #5AA8A0">YOUR LOOK</div>
<div id="looks" role="group" aria-label="Your look" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="w-voice" style="font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; color: #5AA8A0">YOUR VOICE</label>
<div style="display: flex; gap: 8px">
<select id="w-voice" style="flex-grow: 1; min-width: 0; height: 46px; border: 1px solid #2A4A4A; border-radius: 8px; background: #0F1E28; color: #EDE6D6; font-family: 'Cardo', serif; font-size: 15px; padding: 0 10px"></select>
<button type="button" id="btnSample" class="pbtn" aria-label="Hear a sample of this voice" style="width: 46px; height: 46px; flex-shrink: 0; border: 1px solid #D9A441; border-radius: 8px; background: transparent; color: #D9A441; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z M16 9 a4 4 0 0 1 0 6 M18.5 6.5 a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg></button>
</div>
<div id="voiceNote" role="status" aria-live="polite" style="font-size: 13px; font-style: italic; color: #8FA5A3"></div>
</div>
<button type="button" id="btnSave" class="pbtn" style="height: 52px; margin-top: 4px; border: none; border-radius: 8px; background: #D9A441; color: #0F1E28; font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; cursor: pointer">SAVE MY CHARACTER</button>
<div id="lookNote" style="text-align: center; font-size: 13px; font-style: italic; color: #8FA5A3">Only characters that suit tonight's theme are shown.</div>
</div>

</div>
<script type="module" src="js/wardrobe.js"></script>
</body>
</html>
